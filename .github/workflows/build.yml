name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # تثبيت حزم أندرويد المطلوبة مباشرة دون الاعتماد على إجراءات خارجية تطلب رخص مفقودة
    - name: Install Essential Android SDK Components
      run: |
        echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon
      env:
        ORG_GRADLE_PROJECT_jvmargs: "-Xmx2048m -Dfile.encoding=UTF-8"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
