name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # التصحيح: استخدام الإجراء الرسمي الصحيح لإعداد الجافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon
      env:
        ORG_GRADLE_PROJECT_jvmargs: "-Xmx2048m -Dfile.encoding=UTF-8"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
