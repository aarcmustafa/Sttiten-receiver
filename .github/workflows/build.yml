name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # بناء التطبيق مباشرة باستخدام الأداة العامة بدون Daemon معقد
    - name: Build APK with Android Command
      run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
