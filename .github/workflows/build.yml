name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # إعداد أدوات أندرويد وتوافق تراخيص الـ SDK تلقائياً
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # توليد ملف الـ Wrapper المستقر
    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    # تنفيذ عملية البناء
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon

    # رفع ملف الـ APK عند النجاح
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
