name: CI to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --user buildozer cython sh

    - name: Ensure local bin in PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Pre-create Android SDK build-tools directory
      run: |
        # إنشاء المجلد مسبقاً وتثبيت الحزم لضمان عدم ضياع aidl
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.0

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload generated APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
