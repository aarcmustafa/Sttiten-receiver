name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # توليد ملفات الـ Wrapper بوضعية نظيفة ومتوافقة
    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    # تنظيف بيئة العمل وإجبار غارادل على البناء بوضع آمن تماماً بدون تعارضات
    - name: Build Debug APK Cleanly
      run: ./gradlew clean assembleDebug --no-daemon --refresh-dependencies
      env:
        ORG_GRADLE_PROJECT_jvmargs: "-Xmx2048m -Dfile.encoding=UTF-8"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
