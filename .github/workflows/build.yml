name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # الموافقة التلقائية والمضمونة على تراخيص الـ SDK عبر تمرير حرف y بصفة مستمرة
    - name: Accept Android SDK Licenses Automatically
      run: |
        echo y | sdkmanager --licenses || true

    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
