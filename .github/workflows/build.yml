name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # توليد ملف الـ Wrapper النظيف
    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    # بناء ملف الـ APK مباشرة بدون أي إضافات SDK خارجية تسبب تداخل التراخيص
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
