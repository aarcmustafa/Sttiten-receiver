name: Build Stitten-receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # توليد ملف الـ Wrapper النظيف بدون أي تبعيات خارجية معقدة
    - name: Generate Clean Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    # بناء التطبيق مع تجاوز أي فحص إجباري للـ SDK غير المتاح
    - name: Build Debug APK Safely
      run: ./gradlew clean assembleDebug --no-daemon -Pandroid.injected.build.model.only.version=3
      env:
        ORG_GRADLE_PROJECT_jvmargs: "-Xmx2048m -Dfile.encoding=UTF-8"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stitten-receiver-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
